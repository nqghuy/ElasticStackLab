[metadata]
creation_date = "2026/09/06"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/09/06"

[rule]
name = "Modify Registry related to hermeticwiper"
description = "Modify Registry related to hermeticwiper"
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100

rule_id = "5de74dbb-db3d-486f-92a2-8366d15742a6"

author = ["Huy"]

tags = [
    "OS: Windows"
]


false_positives = []

exceptions_list = []

required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "registry.data.strings", type = "keyword", ecs = true },
    { name = "registry.hive", type = "keyword", ecs = true },
    { name = "registry.path", type = "keyword", ecs = true },
    { name = "registry.value", type = "keyword", ecs = true },
    { name = "user.id", type = "keyword", ecs = true },
]

related_integrations = []

type = "eql"
language = "eql"

index = [
    "logs-windows.sysmon_operational*",
    "logs-endpoint.events.process-*",
    "logs-endpoint.events.registry-*",
    "winlogbeat-*",
    "logs-windows.powershell_operational*"
]

query = '''
sequence with maxspan=30s
[
  process where host.os.type == "windows" and
  process.name: "reg.exe" and 
  process.command_line: "*Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced*" and 
  process.command_line: "*ShowInfoTip*"
]
[
  process where host.os.type == "windows" and
  process.name: "reg.exe" and 
  process.command_line: "*Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced*" and 
  process.command_line: "*ShowCompColor*"
]
'''

filters = []
actions = []

setup = ""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"

[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
