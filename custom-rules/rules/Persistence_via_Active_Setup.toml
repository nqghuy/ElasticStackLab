[metadata]
creation_date = "2026/09/10"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/09/10"

[rule]
name = "Persistence via Active Setup"
description = "Persistence via Active Setup"
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100

rule_id = "7857b240-dcdb-4b60-9b6e-f917d1dc536f"

author = ["Huy"]

tags = [
    "OS: Windows"
]


false_positives = []

exceptions_list = []

required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "process.command_line", type = "keyword", ecs = true },
    { name = "user.id", type = "keyword", ecs = true },
]

related_integrations = []

type = "eql"
language = "eql"

index = [
    "logs-windows.sysmon_operational*",
    "logs-endpoint.events.process-*",
    "logs-endpoint.events.registry-*",
    "winlogbeat-*",
    "logs-windows.powershell_operational*"
]

query = '''
any where host.os.type == "windows" and  
(
  process.name: "reg.exe" and  process.parent.name : (
    "powershell.exe",
    "pwsh.exe",
    "cmd.exe",
    "wscript.exe",
    "cscript.exe",
    "mshta.exe",
    "rundll32.exe",
    "regsvr32.exe",
    "wmic.exe"
  ) or 
  process.command_line: ("*New-ItemProperty*", "*New-Item*", "*Set-ItemProperty*")
) and 
process.command_line: "*SOFTWARE\\Microsoft\\Active Setup\\Installed Components*" and 
process.command_line: "*StubPath*"
'''

filters = []
actions = []

setup = ""


[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"
 
[[rule.threat.technique]]
id = "T1547"
name = "Boot or Logon Autostart Execution"
reference = "https://attack.mitre.org/techniques/T1547/"
 
[[rule.threat.technique.subtechnique]]
id = "T1547.014"
name = "Active Setup"
reference = "https://attack.mitre.org/techniques/T1547/014/"
 
[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
