[metadata]
creation_date = "2026/08/28"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/08/28"
 
[rule]
name = "Winlogon Helper DLL or Shell Modification"
description = "Adversaries may abuse features of Winlogon to execute DLLs and/or executables when a user logs in. Winlogon.exe is a Windows component responsible for actions at logon/logoff as well as the secure attention sequence (SAS) triggered by Ctrl-Alt-Delete"
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100
 
rule_id = "f7be977d-28ab-4653-9449-3161a408838f"
 
author = ["Huy"]
 
tags = [
    "OS: Windows"
]
 
 
false_positives = []
 
exceptions_list = []
 
required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "registry.data.strings", type = "keyword", ecs = true },
    { name = "registry.hive", type = "keyword", ecs = true },
    { name = "registry.path", type = "keyword", ecs = true },
    { name = "registry.value", type = "keyword", ecs = true },
    { name = "user.id", type = "keyword", ecs = true },
]
 
related_integrations = []
 
type = "eql"
language = "eql"
 
index = [
    "logs-windows.sysmon_operational*",
    "logs-endpoint.events.process-*",
    "logs-endpoint.events.registry-*",
    "winlogbeat-*"
]
 
query = '''
any where host.os.type == "windows" and event.code : ("12", "13", "14") and
registry.path: (
    "*SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\Shell*",
    "*SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\Userinit*",
    "*SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\Notify*"
)
'''
 
filters = []
actions = []
 
setup = ""
 
[[rule.threat]]
framework = "MITRE ATT&CK"
 
[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"
 
[[rule.threat.technique]]
id = "T1547"
name = "Boot or Logon Autostart Execution"
reference = "https://attack.mitre.org/techniques/T1547/"
 
[[rule.threat.technique.subtechnique]]
id = "T1547.004"
name = "Winlogon Helper DLL"
reference = "https://attack.mitre.org/techniques/T1547/004/"
 
[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
