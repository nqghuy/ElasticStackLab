[metadata]
creation_date = "2020/08/27"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/08/27"

[rule]
name = "Modification of Boot Verification Program registry"
description = "Microsoft allows users to define a custom boot verification program for those situations by creating the registry key HKLM\\System\\CurrentControlSet\\Control\\BootVerificationProgram and setting the value of ImagePath to the path of boot verification program.Threat Actor can abuse by creating this registry key and providing a malicious application to be executed during successful boot"
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100

rule_id = "bedcd164-6104-40ae-b40e-3fc2cc727730"

author = ["Huy"]

tags = [
    "OS: Windows"
]


false_positives = []

exceptions_list = []

required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "registry.data.strings", type = "keyword", ecs = true },
    { name = "registry.hive", type = "keyword", ecs = true },
    { name = "registry.path", type = "keyword", ecs = true },
    { name = "registry.value", type = "keyword", ecs = true },
    { name = "user.id", type = "keyword", ecs = true },
]

related_integrations = []

type = "eql"
language = "eql"

index = [
    "logs-windows.sysmon_operational*",
]

query = '''
registry where host.os.type == "windows" and event.type == "change" and
registry.path: "*\\System\\CurrentControlSet\\Control\\BootVerificationProgram*" and 
registry.value: "ImagePath"
'''

filters = []
actions = []

setup = ""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"

[[rule.threat.technique]]
id = "T1547"
name = "Boot or Logon Autostart Execution"
reference = "https://attack.mitre.org/techniques/T1547/"

[[rule.threat.technique.subtechnique]]
id = "T1547.001"
name = "Registry Run Keys / Startup Folder"
reference = "https://attack.mitre.org/techniques/T1547/001/"

[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
