[metadata]
creation_date = "2020/08/22"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/08/22"

[rule]
name = "RestrictedAdminMode Registry Value Tampering"
description = "Enabling Restricted Admin Mode via Command_Prompt,enables an attacker to perform a pass-the-hash attack using RDP."
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100

rule_id = "4906dbc8-a680-41bb-bb5d-db3ff3d5911b"

author = ["Huy"]

tags = [
    "OS: Windows"
]


false_positives = []

exceptions_list = []

required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "registry.data.strings", type = "keyword", ecs = true },
    { name = "registry.hive", type = "keyword", ecs = true },
    { name = "registry.path", type = "keyword", ecs = true },
    { name = "registry.value", type = "keyword", ecs = true },
    { name = "user.id", type = "keyword", ecs = true },
]

related_integrations = []

type = "eql"
language = "eql"

index = [
    "logs-windows.sysmon_operational*",
]

query = '''
any where host.os.type: "windows" and
event.code : ("12", "13", "14") and
registry.path: "*system\\currentcontrolset\\control\\lsa*" and 
registry.value: "DisableRestrictedAdmin" and 
registry.data.strings: ("0", "0x00000000")
'''

filters = []
actions = []

setup = ""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"

[rule.threat.tactic]
id = "TA0005"
name = "Defense Impairment"
reference = "https://attack.mitre.org/tactics/TA0112/"