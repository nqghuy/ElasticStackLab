[metadata]
creation_date = "2026/10/27"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/10/27"

[rule]
name = "Password Filter DLL"
description = "Password Filter DLL"
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100

rule_id = "162355ba-7290-4796-9a56-a9819af8dff6"

author = ["Huy"]
tags = ["OS: Windows"]

false_positives = []
exceptions_list = []

index = [
    "logs-windows.sysmon_operational*",
    "logs-endpoint.events.process-*",
    "logs-endpoint.events.registry-*",
    "winlogbeat-*",
    "logs-windows.powershell_operational*"
]

required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "process.args", type = "keyword", ecs = true },
    { name = "process.parent.name", type = "keyword", ecs = true },
]

related_integrations = []
type = "eql"
language = "eql"

query = '''
registry where host.os.type == "windows" and event.type == "change" and
    registry.path : "*SYSTEM\\*ControlSet*\\Control\\Lsa*" and
    registry.value: "Notification Packages"
'''

filters = []
actions = []
setup = ""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1556"
name = "Modify Authentication Process"
reference = "https://attack.mitre.org/techniques/T1556/"

[[rule.threat.technique.subtechnique]]
id = "T1556.002"
name = "Password Filter DLL"
reference = "https://attack.mitre.org/techniques/T1556/002/"

[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
