[metadata]
creation_date = "2026/10/25"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/10/25"

[rule]
name = "Modify Terminal Services DLL Path"
description = "Modify Terminal Services DLL Path"
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100

rule_id = "9cc6cd69-b38f-4ce1-9f8e-ce5d251f97d4"

author = ["Huy"]
tags = ["OS: Windows"]

false_positives = []
exceptions_list = []

required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "registry.data.strings", type = "keyword", ecs = true },
    { name = "registry.hive", type = "keyword", ecs = true },
    { name = "registry.path", type = "keyword", ecs = true },
    { name = "registry.value", type = "keyword", ecs = true },
    { name = "user.id", type = "keyword", ecs = true },
]

related_integrations = []
type = "eql"
language = "eql"

query = '''
registry where host.os.type == "windows" and event.code: "13" and
registry.path: "*System\\CurrentControlSet\\services\\TermService\\Parameters*" and 
registry.value: "ServiceDll" and not
registry.data.strings: "*C:\\Windows\\system32\\*"
'''

filters = []
actions = []
setup = ""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1505"
name = "Server Software Component"
reference = "https://attack.mitre.org/techniques/T1505/"

[[rule.threat.technique.subtechnique]]
id = "T1505.005"
name = "Terminal Services DLL"
reference = "https://attack.mitre.org/techniques/T1505/005/"

[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
