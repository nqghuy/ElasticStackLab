[metadata]
creation_date = "2026/10/25"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/10/25"

[rule]
name = "Modification of BitLocker FVE Policy via Registry"
description = "Modification of BitLocker FVE Policy via Registry"
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100

rule_id = "2061d9fa-48db-4543-b54c-120b8670d87a"

author = ["Huy"]
tags = ["OS: Windows"]

false_positives = []
exceptions_list = []

required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "process.args", type = "keyword", ecs = true },
    { name = "process.parent.name", type = "keyword", ecs = true },
]

related_integrations = []
type = "eql"
language = "eql"

index = [
    "logs-endpoint.events.process-*",
    "logs-endpoint.events.registry-*",
    "winlogbeat-*",
    "logs-windows.sysmon_operational-*",
    "logs-system.security*"
]

query = '''
any where host.os.type == "windows" and  
(
  process.name: "reg.exe" and  process.parent.name : (
    "powershell.exe",
    "pwsh.exe",
    "cmd.exe",
    "wscript.exe",
    "cscript.exe",
    "mshta.exe",
    "rundll32.exe",
    "regsvr32.exe",
    "wmic.exe"
  ) or 
  process.command_line: ("*New-ItemProperty*", "*New-Item*", "*Set-ItemProperty*")
) and 
process.command_line: "*SOFTWARE\\Policies\\Microsoft\\FVE*" and
process.command_line: (
    "*UseAdvancedStartup*", 
    "*EnableBDEWithNoTPM*", 
    "*UseTPM*", 
    "*UseTPMPIN*", 
    "*UseTPMKey*", 
    "*UseTPMKeyPIN*", 
    "*EnableNonTPM*", 
    "*UsePartialEncryptionKey*", 
    "*UsePIN*"
)
''' 


filters = []
actions = []

setup = ""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"

[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"