[metadata]
creation_date = "2026/09/07"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/09/07"

[rule]
name = "App Paths hijacking"
description = "App Paths hijacking"
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100

rule_id = "ee0c6ea5-5800-40c1-9ce1-50d7204778c8"

author = ["Huy"]

tags = [
    "OS: Windows"
]


false_positives = []

exceptions_list = []

required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "registry.data.strings", type = "keyword", ecs = true },
    { name = "registry.hive", type = "keyword", ecs = true },
    { name = "registry.path", type = "keyword", ecs = true },
    { name = "registry.value", type = "keyword", ecs = true },
    { name = "user.id", type = "keyword", ecs = true },
]

related_integrations = []

type = "esql"
language = "esql"



query = '''
FROM logs-windows.sysmon_operational-* metadata _id, _version, _index
| WHERE host.os.type == "windows"
    AND event.code == "1"
    AND process.name == "reg.exe"
    AND TO_LOWER(process.command_line) LIKE "*app paths*"
    AND TO_LOWER(process.command_line) LIKE "*/d*"
| GROK process.command_line """(?i).*App Paths\\+%{DATA:app_name}" /t REG_SZ /d %{NOTSPACE:target_path} /f.*"""
| EVAL app_name_norm = TO_LOWER(app_name),
       target_name = TO_LOWER(REPLACE(target_path, """^.*\\""", ""))
| WHERE app_name_norm != target_name
| KEEP *
'''

filters = []
actions = []

setup = ""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1112"
name = "Modify Registry"
reference = "https://attack.mitre.org/techniques/T1112/"

[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"
