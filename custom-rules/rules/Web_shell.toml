[metadata]
creation_date = "2026/09/02"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/09/02"

[rule]
name = "Web Shell"
description = "Web Shell"
risk_score = 21
severity = "low"
license = ""
interval = "5m"
from = "now-360s"
to = "now"
max_signals = 100

rule_id = "6c4e3809-e97b-4e79-b34e-4c9fb3f6b96b"

author = ["Huy"]

tags = [
    "OS: Windows"
]

false_positives = []

exceptions_list = []

required_fields = [
    { name = "event.type", type = "keyword", ecs = true },
    { name = "host.os.type", type = "keyword", ecs = true },
    { name = "process.executable", type = "keyword", ecs = true },
    { name = "process.name", type = "keyword", ecs = true },
    { name = "file.path", type = "keyword", ecs = true },
]

related_integrations = []

type = "eql"
language = "eql"

index = [
    "logs-windows.sysmon_operational*",
    "logs-endpoint.events.process-*",
    "logs-endpoint.events.registry-*",
    "winlogbeat-*",
    "logs-windows.sysmon_operational-*",
]

query = '''
any where host.os.type: "windows" and 
event.code: "11" and 
(
  (
    file.path : "*\\inetpub\\wwwroot\\*" and 
    file.path : ("*.asp*", "*.asmx", "*.ashx", "*.ascx", "*.asax", "*.ph*", "*.js*", "*.do", "*.html", "*.htm*", "*.cs")
  ) or 
  (
    file.path : ("*\\www\\*", "*\\htdocs\\*", "*\\html\\*") and 
    file.path : ("*.ph", "*.php")
  )
)
'''

filters = []
actions = []

setup = ""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1505"
name = "Server Software Component"
reference = "https://attack.mitre.org/techniques/T1505/"

[[rule.threat.technique.subtechnique]]
id = "T1505.003"
name = "Web Shell"
reference = "https://attack.mitre.org/techniques/T1505/003/"

[rule.threat.tactic]
id = "TA0003"
name = "Persistence"
reference = "https://attack.mitre.org/tactics/TA0003/"

